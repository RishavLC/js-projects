<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="heart">🤍</h1>

<script>

let heart = document.getElementById("heart");
let liked = false;

document.addEventListener("dblclick", function(){

    if(liked){

        heart.innerHTML = "🤍";
        liked = false;

    }else{

        heart.innerHTML = "❤️";
        liked = true;

    }

});

</script>
</body>
</html>
