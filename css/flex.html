<html>
    <head>
        <title>Flexbox</title>
        <style>
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: row-reverse;
                margin: 20px;
                border: #e91515 1px solid;
            }
            .item {
                background-color: lightblue;
                padding: 12px;
                font-size: 24px;
                margin: 4px;
                /* border: none; */
                border-radius: 14px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </body>
</html>
