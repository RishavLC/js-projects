<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .card {
      display: grid;
      grid-template-rows: 180px auto auto;
      width: 300px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      padding: 16px;
    }

    .content h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .content p {
      margin: 0;
      color: #555;
    }

    .button {
      padding: 16px;
    }

    .button button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* .button button:hover {
      background: #0056b3;
    } */
  </style>
</head>
<body>

  <div class="card">
    <img src="https://picsum.photos/300/180" alt="Card Image">

    <div class="content">
      <h2>Simple Grid Card</h2>
      <p>This card layout.</p>
    </div>

    <div class="button">
      <button>Learn More</button>
    </div>
  </div>

</body>
</html>
